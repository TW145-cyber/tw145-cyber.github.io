<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nocturne</title>
<style>
  :root { --bg: #ECEAF2; --text: #15131D; --text2: rgba(20, 18, 32, .66); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #060609; --text: #F3F2F8; --text2: rgba(242, 240, 255, .66); } }
  :root[data-theme="dark"] { --bg: #060609; --text: #F3F2F8; --text2: rgba(242, 240, 255, .66); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0; color: var(--text2); }
</style>
</head>
<body>
<main>
  <h1>Nocturne</h1>
  <p>Playlists shared from the Nocturne music player open here. Tap a shared playlist's link on a phone with Nocturne to get it.</p>
</main>
</body>
</html>
