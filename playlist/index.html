<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>A Nocturne playlist</title>
<meta name="description" content="A playlist shared from Nocturne. Tap to open it in Nocturne and get the songs.">
<meta property="og:title" content="A playlist shared from Nocturne">
<meta property="og:description" content="Tap to open it in Nocturne and get the songs.">
<meta name="theme-color" content="#060609">
<style>
  :root {
    --bg: #ECEAF2; --text: #15131D; --text2: rgba(20, 18, 32, .66); --text3: rgba(20, 18, 32, .45);
    --surface: rgba(26, 20, 51, .045); --line: rgba(26, 20, 51, .09); --accent: #7C6CF0; --accent2: #FF5FA2; --on-accent: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #060609; --text: #F3F2F8; --text2: rgba(242, 240, 255, .66); --text3: rgba(242, 240, 255, .42);
      --surface: rgba(255, 255, 255, .045); --line: rgba(255, 255, 255, .08);
    }
  }
  :root[data-theme="dark"] {
    --bg: #060609; --text: #F3F2F8; --text2: rgba(242, 240, 255, .66); --text3: rgba(242, 240, 255, .42);
    --surface: rgba(255, 255, 255, .045); --line: rgba(255, 255, 255, .08);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image: radial-gradient(60rem 30rem at 20% -10%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%),
                      radial-gradient(40rem 26rem at 110% 10%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 70%);
    background-repeat: no-repeat;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  .brand { font-weight: 800; letter-spacing: .02em; color: var(--text2); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .card { margin-top: 18px; padding: 24px 20px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line);
          backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; }
  #count { margin: 6px 0 0; color: var(--text2); font-weight: 600; font-size: 14px; }
  .open { display: flex; justify-content: center; align-items: center; margin-top: 20px; height: 52px; border-radius: 26px;
          background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 17px; text-decoration: none; }
  .open[hidden] { display: none; }
  #note { margin: 12px 0 0; color: var(--text2); font-size: 14px; }
  ol { list-style: none; margin: 18px 0 0; padding: 0; counter-reset: n; }
  li { counter-increment: n; display: flex; align-items: center; gap: 14px; padding: 10px 4px; border-top: 1px solid var(--line); }
  li::before { content: counter(n); width: 24px; text-align: right; color: var(--text3); font-variant-numeric: tabular-nums; font-size: 14px; flex: none; }
  li div { flex: 1; min-width: 0; }
  .title, .artist { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title { font-weight: 650; }
  .artist { color: var(--text2); font-size: 14px; }
  .time { color: var(--text3); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
</style>
</head>
<body>
<main>
  <div class="brand">Nocturne</div>
  <section class="card">
    <h1 id="name">A Nocturne playlist</h1>
    <p id="count"></p>
    <a id="open" class="open" hidden>Open in Nocturne</a>
    <p id="note"></p>
  </section>
  <ol id="songs"></ol>
</main>
<script src="playlist.js"></script>
</body>
</html>
